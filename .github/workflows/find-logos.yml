name: Find funder logos (temporary)
on:
  push:
    paths: [scripts/find-funder-logos.mjs, .github/workflows/find-logos.yml]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/find-funder-logos.mjs
      - run: |
          git add public/images/funders/candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Funder logo candidates (temporary)" && git pull --rebase && git push || echo nothing
