name: Update film ratings

# Refreshes the IMDb ratings shown on the Team page once a week,
# and whenever a team member is added or changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: [src/content/team/**]

permissions:
  contents: write

jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-film-ratings.mjs
      - name: Commit updated ratings
        run: |
          git add src/data/film-ratings.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update film ratings"
            git push
          fi
